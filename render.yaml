# Render Blueprint — provisions the backend, Postgres, and Redis together.
# Deploy via Render dashboard: New -> Blueprint -> select this repo.
# Double-check field names against Render's current docs before using —
# their service-type and plan naming has changed over time (e.g. "redis" vs
# "keyvalue"; Postgres plans moved from starter/standard/pro to size-based
# names like basic-256mb). This is a starting point, not guaranteed to apply
# as-is — if Render rejects a plan name, its dashboard picker shows the
# current valid options.

databases:
  - name: chessai-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: redis
    name: chessai-redis
    plan: starter
    region: oregon
    ipAllowList: []

  - type: web
    name: chessai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    # Now on "standard" (1 vCPU / 2GB), up from "starter" (0.5 vCPU / 512MB).
    # STOCKFISH_POOL_SIZE should match actual vCPU count -- on a single real
    # core, running 2+ concurrent Stockfish processes doesn't give true
    # parallelism (they'd just contend for the same core), so leave it at
    # the default of 1 here. The extra RAM still helps: bump
    # STOCKFISH_HASH_MB (dashboard env var below) for a bigger transposition
    # table on that one engine -- faster/better search at the same depth,
    # no extra cores needed. Only raise STOCKFISH_POOL_SIZE above 1 if this
    # plan is upgraded again to 2+ vCPU -- see backend/engine_pool.py's
    # docstring for what each var controls.
    # Changing `plan:` here and re-syncing the Blueprint resizes the LIVE
    # service (real cost change) -- do that deliberately, not as a side
    # effect of a code deploy.
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chessai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: chessai-redis
          property: connectionString
      # Set manually in the Render dashboard (Environment tab) — not stored
      # in this file:
      - key: INTERNAL_JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: AI_PROVIDER
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: VISION_PROVIDER
        sync: false
      - key: LICHESS_EXPLORER_TOKEN
        sync: false
      # Stockfish engine pool sizing (backend/engine_pool.py). On the current
      # "standard" plan (1 vCPU/2GB), set STOCKFISH_HASH_MB=256 here — more
      # RAM for the one engine's transposition table, real speed win with no
      # extra cores needed. Leave STOCKFISH_POOL_SIZE unset (defaults to 1) —
      # only raise it to match vCPU count if this plan is upgraded to 2+ vCPU.
      - key: STOCKFISH_POOL_SIZE
        sync: false
      - key: STOCKFISH_HASH_MB
        sync: false
