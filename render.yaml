# Render Blueprint — provisions the backend, Postgres, and Redis together.
# Deploy via Render dashboard: New -> Blueprint -> select this repo.
# Double-check field names against Render's current docs before using —
# their service-type and plan naming has changed over time (e.g. "redis" vs
# "keyvalue"; Postgres plans moved from starter/standard/pro to size-based
# names like basic-256mb). This is a starting point, not guaranteed to apply
# as-is — if Render rejects a plan name, its dashboard picker shows the
# current valid options.

databases:
  - name: chessai-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: redis
    name: chessai-redis
    plan: starter
    region: oregon
    ipAllowList: []

  - type: web
    name: chessai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    # Currently on "starter" (0.5 vCPU / 512MB) -- the Stockfish engine pool
    # (backend/engine_pool.py) defaults to STOCKFISH_POOL_SIZE=1, which keeps
    # behaviour on this plan identical to the old single-engine setup: safe
    # to deploy before upgrading. To actually use more CPU after bumping this
    # to "standard" (1 vCPU / 2GB) or higher, set STOCKFISH_POOL_SIZE=2 (or
    # match vCPU count) and STOCKFISH_HASH_MB=128 as dashboard env vars below
    # -- see backend/engine_pool.py's docstring for what each controls.
    # Changing `plan:` here and re-syncing the Blueprint resizes the LIVE
    # service (real cost change) -- do that deliberately, not as a side
    # effect of a code deploy.
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chessai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: chessai-redis
          property: connectionString
      # Set manually in the Render dashboard (Environment tab) — not stored
      # in this file:
      - key: INTERNAL_JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: AI_PROVIDER
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: VISION_PROVIDER
        sync: false
      - key: LICHESS_EXPLORER_TOKEN
        sync: false
      # Stockfish engine pool sizing (backend/engine_pool.py) — leave unset
      # (defaults to 1 / 32) on the current "starter" plan. After upgrading
      # to "standard" (1 vCPU/2GB) or higher, set STOCKFISH_POOL_SIZE=2 and
      # STOCKFISH_HASH_MB=128 here to actually use the extra CPU/RAM.
      - key: STOCKFISH_POOL_SIZE
        sync: false
      - key: STOCKFISH_HASH_MB
        sync: false
