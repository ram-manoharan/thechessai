# Render Blueprint — provisions the backend, Postgres, and Redis together.
# Deploy via Render dashboard: New -> Blueprint -> select this repo.
# Double-check field names against Render's current docs before using —
# their service-type and plan naming has changed over time (e.g. "redis" vs
# "keyvalue"; Postgres plans moved from starter/standard/pro to size-based
# names like basic-256mb). This is a starting point, not guaranteed to apply
# as-is — if Render rejects a plan name, its dashboard picker shows the
# current valid options.

databases:
  - name: chessai-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
    # REVERTED -- attempted Render-managed PgBouncer here (connectionPool:
    # pgbouncer + DATABASE_URL via connectionPoolString below), but it took
    # the live web service down: asyncpg.create_pool() failed at startup
    # with ConnectionRefusedError on every attempt, crash-looping the
    # instance. Root cause not confirmed (pooler not actually listening on
    # this plan tier vs. some sync-timing issue) -- reverted to a direct
    # connection to restore service first, worth re-investigating
    # separately, off the critical path, before trying again.

services:
  - type: redis
    name: chessai-redis
    plan: starter
    region: oregon
    ipAllowList: []

  - type: web
    name: chessai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    # RESOLVED: confirmed live in the dashboard as Pro (2 dedicated vCPU /
    # 4GB RAM), upgraded from Starter (0.5 vCPU / 512MB) -- `plan:` below
    # now matches. This is what makes STOCKFISH_POOL_SIZE=2 (dashboard env
    # var below) actually safe: 2 real cores means 2 concurrent Stockfish
    # processes get true parallelism instead of contending for one core.
    # This is also the first plan tier where chess_analysis.py's per-game
    # chunked parallelization (see its own comments) actually does
    # anything -- at pool size 1 it's a verified no-op, byte-identical to
    # the old sequential behaviour.
    plan: pro
    healthCheckPath: /api/health
    # Now that /api/analysis/game/enqueue + /game/status hand the actual
    # engine/AI work off to the worker fleet below, this tier is safe to
    # replicate -- it's no longer holding a thread + SSE connection open for
    # the length of a full analysis on the new path (the old /game/stream
    # still does, on whichever replica handles it, but that's now a
    # fallback path, not the primary one). Same cost-change caveat as
    # `plan:` above: this is a real, billed instance count, raise it
    # deliberately.
    numInstances: 2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chessai-db
          # Direct connection -- see the REVERTED note on chessai-db above.
          # connectionPoolString took the service down; back to this known-
          # working value until that's debugged separately.
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: chessai-redis
          property: connectionString
      # Set manually in the Render dashboard (Environment tab) — not stored
      # in this file:
      - key: INTERNAL_JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: AI_PROVIDER
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: VISION_PROVIDER
        sync: false
      - key: LICHESS_EXPLORER_TOKEN
        sync: false
      # Stockfish engine pool sizing (backend/engine_pool.py). Now on Pro
      # (2 dedicated vCPU / 4GB) -- set STOCKFISH_POOL_SIZE=2 in the
      # dashboard to match (defaults to 1 if left unset, which would leave
      # the 2nd core idle for this pool). STOCKFISH_HASH_MB=128 is a
      # reasonable transposition-table size for 2 engines sharing 4GB
      # alongside the rest of the process -- raise it if memory headroom
      # allows, watch for OOM if it doesn't.
      - key: STOCKFISH_POOL_SIZE
        sync: false
      - key: STOCKFISH_HASH_MB
        sync: false
      # Maia/lc0 replay engine pool (backend/human_engine_pool.py). Left at
      # its default of 1 even on 2 vCPU -- replay calls are individually
      # light (a single lc0 forward pass), so both cores are better spent
      # on Stockfish/report generation than split off for this. Revisit if
      # replay traffic specifically becomes the bottleneck.
      - key: MAIA_POOL_SIZE
        sync: false

  # Horizontal worker fleet for the job queue (backend/jobs.py + worker.py).
  # This is the actual scale-out lever: analysis capacity = numInstances x
  # STOCKFISH_POOL_SIZE per instance, and it scales independently of the web
  # tier above -- add more of these under load without touching the web
  # service at all. Each instance is a fully independent process pulling
  # jobs off the same Redis queue; nothing here needs to know about the
  # others.
  - type: worker
    name: chessai-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python worker.py
    region: oregon
    # Standard (1 dedicated vCPU), not Starter (0.5 vCPU, shared/burstable)
    # -- Standard is the best $/core on Render's lineup, and dedicated cores
    # matter more here than on the web tier since every core is a full,
    # sustained Stockfish search, not bursty request handling. Many small
    # dedicated-core instances beat one big instance for a workload made of
    # independent single-threaded engine processes.
    plan: standard
    # 2 to actually demonstrate horizontal scaling, not just stand up "a
    # worker". Bump this as real concurrent-analysis traffic demands it --
    # same real-cost-change caveat as everywhere else in this file: raise it
    # deliberately, not as a side effect of an unrelated deploy.
    numInstances: 2
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: chessai-redis
          property: connectionString
      # Same AI-provider credentials as the web service above -- this is
      # what actually writes each job's coaching report.
      - key: AI_PROVIDER
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      # Per-instance Stockfish pool sizing -- same rule as the web service:
      # match this plan's real vCPU count, don't exceed it. At Standard's 1
      # dedicated vCPU, leave this at the default of 1.
      - key: STOCKFISH_POOL_SIZE
        sync: false
      - key: STOCKFISH_HASH_MB
        sync: false
